<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>阿葉Unity工具包</title>
<style>
  body { font-family: "Microsoft JhengHei", sans-serif; max-width: 720px; margin: 0 auto; padding: 24px 16px; line-height: 1.7; color: #222; }
  h1 { text-align: center; }
  .dl { display: block; width: fit-content; margin: 24px auto; padding: 14px 32px; background: #2b7de9; color: #fff; text-decoration: none; border-radius: 8px; font-size: 1.2em; }
  .dl:hover { background: #1a63c4; }
  img { max-width: 100%; border: 1px solid #ccc; border-radius: 4px; }
  ol li { margin-bottom: 24px; }
</style>
</head>
<body>
<h1>阿葉Unity工具包</h1>
<a class="dl" href="https://github.com/A-yea/AYEUnityTools/releases/latest/download/AYEUnityTools.unitypackage">⬇ 下載 AYEUnityTools.unitypackage</a>

<h2>安裝步驟</h2>
<ol>
  <li>
    下載上方的 <code>.unitypackage</code> 檔，然後在 Unity 選單點選
    <b>Assets → Import Package… → Import Asset Package…</b>（匯入資源包）。<br>
    <img src="images/step1.png" alt="Assets 選單中的 Import Asset Package">
  </li>
  <li>
    在視窗中找到剛下載的 <code>AYEUnityTools.unitypackage</code>，點選「開啟」，再於 Unity 跳出的視窗按 <b>Import</b> 即完成。<br>
    <img src="images/step2.png" alt="選擇 unitypackage 檔案並開啟">
  </li>
</ol>
</body>
</html>
